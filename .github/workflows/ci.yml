# =============================================================================
# Cortex CI Pipeline
# Triggered on pull requests to main.
# Jobs: frontend-lint, frontend-test, backend-lint, backend-test
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  # ── Frontend Lint ────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npx prettier --check src

      - name: Type check (tsc)
        run: npx tsc --noEmit

  # ── Frontend Tests ───────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend — Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/

  # ── Backend Lint ─────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

  # ── Backend Tests ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # No external services needed — Cortex uses SQLite (aiosqlite) for all
    # persistence in both development and CI. Redis is optional (rate limiting
    # state is process-local). Neo4j is not used (graph is SQLite-backed).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest -q --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_cortex.db"
          GITHUB_TOKEN: ""
          NIM_API_KEY: ""
          INTERNAL_SECRET: "ci-test-secret"

      - name: Clean up test database
        if: always()
        run: rm -f test_cortex.db
