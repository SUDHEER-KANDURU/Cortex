# =============================================================================
# Cortex — Docker Compose (production-aligned)
#
# Cortex uses SQLite for all persistence (graph, auth, memory, jobs).
# No external database services are required.
#
# Services:
#   api      — FastAPI backend (serves API + runs background pipeline jobs)
#   frontend — Next.js frontend
#
# Optional (uncomment if needed):
#   redis    — For distributed rate limiting across multiple workers
# =============================================================================

version: "3.9"

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///./data/cortex.db"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NIM_API_KEY: ${NIM_API_KEY:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: "0.0.0.0"
      PORT: "8000"
      RELOAD: "false"
    ports:
      - "8000:8000"
    volumes:
      - cortex_data:/app/data
    networks:
      - cortex_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    networks:
      - cortex_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Redis (optional — for distributed rate limiting) ────────────────────────
  # Uncomment if running multiple API workers and need shared rate limit state.
  # redis:
  #   image: redis:7.2-alpine
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - cortex_network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  cortex_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  cortex_network:
    driver: bridge
